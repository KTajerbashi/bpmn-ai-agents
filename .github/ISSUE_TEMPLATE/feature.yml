name: Feature request
description: Propose a capability or workflow scenario
title: "[Feature]: "
labels: ["enhancement"]
body:
  - type: textarea
    id: problem
    attributes:
      label: Problem / user outcome
      description: What user or business outcome is needed?
      placeholder: Describe the problem, not only the proposed implementation.
    validations:
      required: true
  - type: textarea
    id: workflow
    attributes:
      label: BPMN / workflow scenario
      description: Which activities, gateways, timers, AI tasks, or human tasks are involved?
    validations:
      required: false
  - type: textarea
    id: acceptance
    attributes:
      label: Acceptance criteria
      description: List observable, testable outcomes.
    validations:
      required: true
  - type: textarea
    id: constraints
    attributes:
      label: Security, reliability, and constraints
      description: Include tenant scope, authorization, failure behavior, data retention, and performance constraints.
    validations:
      required: false
